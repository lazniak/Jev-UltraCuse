[package]
name = "ultracuse"
description = "Jev-UltraCuse — voice-first, Jev-decided Computer Use for Windows as one portable exe."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ultracuse"
path = "src/main.rs"

[dependencies]
uc-win32 = { path = "../crates/uc-win32" }
uc-uia = { path = "../crates/uc-uia" }
uc-input = { path = "../crates/uc-input" }
uc-shell = { path = "../crates/uc-shell" }
uc-jev = { path = "../crates/uc-jev" }
uc-loop = { path = "../crates/uc-loop" }
uc-two = { path = "../crates/uc-two" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
# wgpu (DX12) rather than glow: works over RDP and on VMs without OpenGL; accesskit = screen readers.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
